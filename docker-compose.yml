version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dancegpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dancegpt
      POSTGRES_USER: dancegpt
      POSTGRES_PASSWORD: dancegpt
    # Host 5433 avoids clashing with a local Postgres on 5432 (brew / Postgres.app).
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancegpt -d dancegpt"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
